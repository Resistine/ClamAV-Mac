name: Build ClamAV Artifacts

on:
  push:
    branches: [main, clamav-artifact]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # ── Install build tools and dependencies ──
      - name: Install build tools
        run: brew install bison flex

      - name: Install dependencies
        run: brew install check curl json-c libxml2 ncurses openssl@3 pcre2 zlib

      # ── Cache Rust/Cargo (used by libclamav_rust) ──
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/_deps
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── CMake configure ──
      - name: Configure CMake
        run: |
          OPENSSL_DIR="$(brew --prefix openssl@3)"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DENABLE_CLAMONACC=ON \
            -DENABLE_EXAMPLES=OFF \
            -DENABLE_MILTER=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_MAN_PAGES=OFF \
            -DENABLE_DOXYGEN=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_DIR" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_DIR/lib/libcrypto.dylib" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_DIR/lib/libssl.dylib"

      # ── Build ──
      - name: Build
        run: cmake --build build -j $(sysctl -n hw.ncpu)

      # ── Install ──
      - name: Install
        run: cmake --install build

      # ── Fix rpaths so binaries are relocatable ──
      - name: Fix rpaths
        run: |
          OPENSSL_DIR="$(brew --prefix openssl@3)"
          INSTALL_LIB="$GITHUB_WORKSPACE/install/lib"

          JSONC_DIR="$(brew --prefix json-c)"

          fix_dep_paths() {
            local binary="$1"
            for lib in libssl.3.dylib libcrypto.3.dylib libjson-c.5.dylib; do
              local old_path=""
              old_path=$(otool -L "$binary" 2>/dev/null | grep "$lib" | awk '{print $1}' | head -1) || true
              if [ -n "$old_path" ] && [ "$old_path" != "@rpath/$lib" ]; then
                install_name_tool -change "$old_path" "@rpath/$lib" "$binary" 2>/dev/null || true
              fi
            done
            install_name_tool -add_rpath "$INSTALL_LIB" "$binary" 2>/dev/null || true
            install_name_tool -add_rpath "$OPENSSL_DIR/lib" "$binary" 2>/dev/null || true
            install_name_tool -add_rpath "$JSONC_DIR/lib" "$binary" 2>/dev/null || true
          }

          # Fix libraries (skip symlinks)
          for dylib in "$INSTALL_LIB"/*.dylib; do
            [ -f "$dylib" ] || continue
            [ -L "$dylib" ] && continue
            fix_dep_paths "$dylib"
            echo "Fixed $(basename "$dylib")"
          done

          # Fix binaries
          for bin in clamd clamonacc freshclam clamscan clamdscan clamsubmit clambc clamconf sigtool clamdtop; do
            local_bin="$GITHUB_WORKSPACE/install/sbin/$bin"
            [ -f "$local_bin" ] || local_bin="$GITHUB_WORKSPACE/install/bin/$bin"
            [ -f "$local_bin" ] || continue
            fix_dep_paths "$local_bin"
            echo "Fixed $bin"
          done

      # ── Assemble artifact directory ──
      # upload-artifact does not preserve symlinks — they become full copies.
      # We upload only the real (versioned) files and a symlinks.txt manifest.
      # The downstream download script recreates symlinks from the manifest.
      - name: Assemble artifacts
        run: |
          OPENSSL_DIR="$(brew --prefix openssl@3)"
          ARTIFACTS="$GITHUB_WORKSPACE/build/artifacts"
          INSTALL_LIB="$GITHUB_WORKSPACE/install/lib"
          mkdir -p "$ARTIFACTS/binaries" "$ARTIFACTS/lib"

          # Binaries that Resistine-Desktop expects
          for bin in clamonacc clamd; do
            cp "$GITHUB_WORKSPACE/install/sbin/$bin" "$ARTIFACTS/binaries/"
            echo "Packaged: $bin"
          done

          for bin in clamscan clamdscan freshclam; do
            cp "$GITHUB_WORKSPACE/install/bin/$bin" "$ARTIFACTS/binaries/"
            echo "Packaged: $bin"
          done

          # Shared libraries — real .dylib files only (skip symlinks and .a static libs)
          for f in $INSTALL_LIB/lib{clamav,freshclam,clammspack,clamunrar,clamunrar_iface}*.dylib; do
            [ -e "$f" ] || continue
            [ -L "$f" ] && continue
            cp "$f" "$ARTIFACTS/lib/"
            echo "Packaged: $(basename "$f")"
          done

          # Record symlink map so downstream can recreate them
          # Format: <symlink-name> -> <target>
          > "$ARTIFACTS/lib/symlinks.txt"
          for f in $INSTALL_LIB/lib{clamav,freshclam,clammspack,clamunrar,clamunrar_iface}*.dylib; do
            [ -L "$f" ] || continue
            link_name="$(basename "$f")"
            link_target="$(readlink "$f")"
            echo "$link_name -> $link_target" >> "$ARTIFACTS/lib/symlinks.txt"
            echo "Recorded symlink: $link_name -> $link_target"
          done

          # Bundle OpenSSL from brew (binaries link against these, no symlinks needed)
          cp "$OPENSSL_DIR/lib/libssl.3.dylib" "$ARTIFACTS/lib/"
          cp "$OPENSSL_DIR/lib/libcrypto.3.dylib" "$ARTIFACTS/lib/"

          # Bundle libjson-c from brew (libclamav links against it)
          JSONC_DIR="$(brew --prefix json-c)"
          for f in "$JSONC_DIR"/lib/libjson-c*.dylib; do
            [ -e "$f" ] || continue
            [ -L "$f" ] && continue
            cp "$f" "$ARTIFACTS/lib/"
            echo "Packaged: $(basename "$f")"
          done
          for f in "$JSONC_DIR"/lib/libjson-c*.dylib; do
            [ -L "$f" ] || continue
            link_name="$(basename "$f")"
            link_target="$(readlink "$f")"
            echo "$link_name -> $link_target" >> "$ARTIFACTS/lib/symlinks.txt"
            echo "Recorded symlink: $link_name -> $link_target"
          done

          # Entitlements for downstream signing (ESF)
          cp "$GITHUB_WORKSPACE/entitlements.plist" "$ARTIFACTS/entitlements.plist"

          echo ""
          echo "=== Artifacts ==="
          ls -lhR "$ARTIFACTS"
          echo ""
          echo "=== Symlink manifest ==="
          cat "$ARTIFACTS/lib/symlinks.txt"

      # ── Generate checksums ──
      - name: Generate checksums
        run: |
          cd build/artifacts
          find binaries -type f -exec shasum -a 256 {} + > checksums.txt
          find lib -type f -exec shasum -a 256 {} + >> checksums.txt
          shasum -a 256 entitlements.plist >> checksums.txt
          echo "=== Checksums ==="
          cat checksums.txt

      # ── Upload artifacts (SHA-tagged) ──
      - name: Upload ClamAV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clamav-macos-${{ github.sha }}
          path: build/artifacts/
          retention-days: 30

      # ── On main: also upload a "latest" artifact ──
      - name: Upload latest artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: clamav-macos-latest
          path: build/artifacts/
          retention-days: 90
          overwrite: true
